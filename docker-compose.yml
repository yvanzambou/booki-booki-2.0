services:
  db:
    image: postgres:17-alpine
    container_name: booki-booki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booki_booki}
      POSTGRES_USER: ${POSTGRES_USER:-booki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_sql_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booki_user} -d ${POSTGRES_DB:-booki_booki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booki-booki-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      BACKEND_PORT: 5000
      PGHOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-booki_booki}
      POSTGRES_USER: ${POSTGRES_USER:-booki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BOOKS_JSON_PATH: /app/database/books.json
    volumes:
      - ./database:/app/database:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:import && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: booki-booki-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend

volumes:
  postgres_sql_data: